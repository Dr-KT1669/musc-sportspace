<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071833" />
    <meta name="description" content="MUSC SportSpace ระบบจองสนามกีฬาและอุปกรณ์กีฬา คณะวิทยาศาสตร์ มหาวิทยาลัยมหิดล" />
    <title>MUSC SportSpace · จองสนามกีฬา คณะวิทยาศาสตร์ มหิดล</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const saved = localStorage.getItem('sportspace-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
